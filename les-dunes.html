<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Quête des Petits Baigneurs - Énigme</title>
    <style>
        body {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            max-width: 250px;
            margin-bottom: 30px;
        }

        .enigme-texte {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .fw-light { font-weight: 300; }
        .fw-regular { font-weight: 400; }
        .fw-bold { font-weight: bold; }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            font-size: 1rem;
            padding: 10px 15px;
            border: 2px solid #333;
            border-radius: 4px;
            width: 100%;
            max-width: 250px;
            margin-bottom: 10px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]::placeholder {
            color: #999;
            font-style: italic;
        }

        button {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: white;
            color: #333;
        }

        button:disabled, input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .compteur {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        #message-resultat {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #333;
            background-color: #f9f9f9;
            text-align: center;
        }

        #message-resultat h3 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Nouveaux styles pour la vidéo */
        .video-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        video, iframe {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .erreur {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Bleu Logo petits baigneurs0.png" alt="Logo La Quête des Petits Baigneurs" class="logo">

        <p class="enigme-texte fw-regular">
            L'initiale est la clé.
        </p>

        <div class="input-group" id="zone-saisie">
            <input type="text" id="reponse-input" placeholder="Saisissez votre réponse">
            <br>
            <button id="btn-valider" onclick="verifierReponse()">Valider</button>
        </div>

        <p class="compteur" id="texte-compteur">Tentatives restantes : <span id="nb-essais">4</span></p>

        <div id="message-erreur" class="erreur">Mauvaise réponse. Essayez encore !</div>

        <!-- ZONE DE RÉSULTAT MODIFIÉE AVEC LA VIDÉO -->
        <div id="message-resultat">
            <h3>Bravo !</h3>
            
            <div class="video-container">
                <!-- Option 1 : Vidéo hébergée sur GitHub (Fichier local) -->
                <video controls width="500">
                    <source src="Test-video-les-dune.mp4" type="video/mp4">
                    Votre navigateur ne prend pas en charge la lecture de vidéos.
                </video>

                <!-- Option 2 : Si vous utilisez YouTube ou Vimeo, effacez les balises <video> ci-dessus et collez votre <iframe> ici -->
            </div>

        </div>
    </div>

    <script>
        let tentativesRestantes = 4;
        
        const reponsesAcceptees = ["pudeur"]; 

        function verifierReponse() {
            const inputElement = document.getElementById("reponse-input");
            const btnElement = document.getElementById("btn-valider");
            const msgErreur = document.getElementById("message-erreur");
            const msgResultat = document.getElementById("message-resultat");
            const nbEssaisElement = document.getElementById("nb-essais");

            const reponseJoueur = inputElement.value.trim().toLowerCase();

            if (reponseJoueur === "") return; 

            if (reponsesAcceptees.includes(reponseJoueur)) {
                document.getElementById("zone-saisie").style.display = "none";
                document.querySelector(".enigme-texte").style.display = "none";
                document.getElementById("texte-compteur").style.display = "none";
                msgErreur.style.display = "none";
                msgResultat.style.display = "block";
            } else {
                tentativesRestantes--;
                nbEssaisElement.textContent = tentativesRestantes;
                msgErreur.style.display = "block";
                
                inputElement.value = "";

                if (tentativesRestantes <= 0) {
                    inputElement.disabled = true;
                    btnElement.disabled = true;
                    msgErreur.textContent = "Vous n'avez plus de tentatives ! L'énigme est bloquée.";
                }
            }
        }

        document.getElementById("reponse-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifierReponse();
            }
        });
    </script>

</body>
</html>
