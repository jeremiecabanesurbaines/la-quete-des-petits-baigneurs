<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Quête des Petits Baigneurs - Énigme</title>
    <style>
        body {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        .logo {
            max-width: 250px;
            margin-bottom: 30px;
        }

        .enigme-texte {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .fw-light { font-weight: 300; }
        .fw-regular { font-weight: 400; }
        .fw-bold { font-weight: bold; }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            font-size: 1rem;
            padding: 10px 15px;
            border: 2px solid #333;
            border-radius: 4px;
            width: 250px; /* Légèrement élargi pour les réponses longues */
            margin-bottom: 10px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: #999;
            font-style: italic;
        }

        button {
            font-family: "American Typewriter", "Courier New", Courier, serif;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: white;
            color: #333;
        }

        button:disabled, input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .compteur {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
        }

        #message-resultat {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #333;
            background-color: #f9f9f9;
            text-align: left;
        }

        #message-resultat h3 {
            margin-top: 0;
            text-align: center;
        }

        .erreur {
            color: #d9534f;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Moutarde Logo petits baigneurs0.png" alt="Logo La Quête des Petits Baigneurs" class="logo">

        <p class="enigme-texte fw-regular">
